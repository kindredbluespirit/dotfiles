# Created so podman/buildah inject usable DNS nameservers into containers.
# The host uses systemd-resolved and /etc/resolv.conf carries no nameserver
# lines, so containers inherit an empty resolver and fail to resolve hosts
# (e.g. "Temporary failure resolving 'archive.ubuntu.com'" during docker build).
[containers]
dns_servers = ["9.9.9.9", "75.75.75.75"]
