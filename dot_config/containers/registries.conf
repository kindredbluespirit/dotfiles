# Created to let podman (which this host uses to emulate the docker CLI)
# resolve unqualified/short image names to Docker Hub, matching Docker's
# default behaviour. Without this, builds fail with:
#   short-name "nvidia/cuda@sha256:..." did not resolve to an alias and no
#   containers-registries.conf(5) was found
unqualified-search-registries = ["docker.io"]
